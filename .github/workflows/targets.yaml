on:
  workflow_dispatch:
   schedule:
     - cron: '0 3 * * 1' # every Monday at 03:00 UTC

name: targets

concurrency:
  group: emma-envdata-targets
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    # Pinned 2026-10-07 from adamwilsonlab/emma:latest.
    container: adamwilsonlab/emma@sha256:a92aedd24769c12b8039130f3dd3f57afa83622f8b539c648a5af0c5fbbb5087
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      R_LIBS_USER: ${{ github.workspace }}/.r-lib
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
      ACTIONS_RUNNER_DEBUG: true
      # Newest missing burn months per product per run. Full history is primed
      # on CCR; set to 0 to disable the cap.
      CI_APPEEARS_MAX_MONTHS: "24"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Whitelist directory
        run: git config --global --add safe.directory /__w/emma_envdata/emma_envdata
      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: .r-lib
          key: r-lib-${{ hashFiles('DESCRIPTION') }}
          restore-keys: r-lib-
      - name: Install R Package Dependencies
        run: |
          mkdir -p "$R_LIBS_USER"
          Rscript -e "dir.create(Sys.getenv('R_LIBS_USER'), recursive = TRUE, showWarnings = FALSE); .libPaths(c(Sys.getenv('R_LIBS_USER'), .libPaths())); if (!requireNamespace('pak', quietly = TRUE)) install.packages('pak', lib = Sys.getenv('R_LIBS_USER')); pak::pak(lib = Sys.getenv('R_LIBS_USER'))"
      - name: Parse _targets.R
        run: Rscript -e "parse('_targets.R')"
      - name: Update new AppEEARS months
        id: targets
        run: |
          set -o pipefail
          Rscript R/ci_appeears_update.R 2>&1 | tee targets-output.log
        shell: bash
      - name: Upload targets cache to GitHub release
        if: success()
        run: |
          Rscript -e "
            source('R/tar_release_storage.R')
            tar_upload_github_release(
              repo      = 'eco-emma/emma_envdata',
              tag       = 'targets-cache',
              cache_dir = '_targets/user/cache',
              verbose   = TRUE
            )
          "
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: targets-failure-log
          path: targets-output.log
          if-no-files-found: warn
