name: Agents checks

on:
  push:
    paths:
      - '**.R'
      - 'R/**'
      - 'scripts/agents/**'
  pull_request:
    paths:
      - '**.R'
      - 'R/**'
      - 'scripts/agents/**'

jobs:
  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
      - name: Install R packages
        run: |
          Rscript -e "install.packages(c('lintr','styler','terra','sf','fs'), repos='https://cloud.r-project.org')"
      - name: Run agent checks
        run: Rscript scripts/agents/ci_check.R
